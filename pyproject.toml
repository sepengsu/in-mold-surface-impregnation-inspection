[project]
name = "vision-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<6",
    "pyyaml>=6.0.3",
    "roboflow>=1.4.2",
    "scikit-image>=0.25,<0.27",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
training = ["torch==2.9.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
