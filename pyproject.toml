[project]
name = "vision-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<6",
    "pyyaml>=6.0.3",
    "roboflow>=1.4.2",
    "scikit-image>=0.25,<0.27",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
training = ["torch==2.9.1"]
segmentation-benchmark = ["torch==2.9.1", "torchvision==0.24.1", "segmentation-models-pytorch==0.5.0", "psutil>=7.2.2,<8"]
confident = ["torch==2.9.1", "cleanlab==2.9.0", "psutil>=7.2.2,<8"]
roboflow-masks = ["pycocotools>=2.0.11,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
