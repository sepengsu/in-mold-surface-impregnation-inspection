<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GT · P1 P2 P3 위치</title>
<style>
:root{color-scheme:light;--ink:#1e2c3d;--muted:#647184;--border:#dce2e9;--bg:#f3f5f8;--p1:#ffce60;--p2:#41d8e7;--p3:#b58aff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Segoe UI",sans-serif}button,select,input{font:inherit}button,select{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 11px;color:var(--ink)}button{cursor:pointer}button:hover{background:#edf1f5}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #377cdf;outline-offset:2px}a{color:#245da2;text-underline-offset:3px}label{display:inline-flex;align-items:center;gap:7px}input[type=checkbox]{accent-color:#315c89;width:16px;height:16px}input[type=range]{width:92px;accent-color:#315c89}
header{padding:20px 28px 13px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:25px;line-height:1.2;margin:0 0 5px;font-weight:700}header p{margin:0;color:var(--muted);font-size:13px}.back{font-size:13px;white-space:nowrap}main{max-width:1840px;padding:18px 24px 28px;margin:auto}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.filters label{font-size:13px;color:var(--muted)}#capture{min-width:310px;max-width:100%}.navigation{display:flex;gap:6px;align-items:center;margin-left:auto}#counter{min-width:66px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}.subject{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:15px 0 12px}.subject h2{font-size:21px;margin:0}.subject p{color:var(--muted);font-size:13px;margin:3px 0 0}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#e8edf3;font-size:12px;margin-left:6px;color:#435970}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:16px;align-items:start}.image-pane,.point-panel{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden}.toolbar{padding:9px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:9px;border-bottom:1px solid var(--border);font-size:13px}.toolbar button{padding:5px 9px}.toolbar .separator{height:19px;width:1px;background:var(--border);margin:0 2px}.toolbar #zoom{width:44px;display:inline-block;text-align:center;font-variant-numeric:tabular-nums}.opacity-control{color:var(--muted)}.viewport{height:clamp(520px,67vh,900px);position:relative;overflow:hidden;background:#111720;touch-action:none;cursor:grab;user-select:none}.viewport.dragging{cursor:grabbing}.scene{position:absolute;transform-origin:0 0;width:2046px;height:2046px;will-change:transform}.scene>img,.scene>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}.scene .gt-layer{opacity:.45}#overlay{overflow:visible}#empty,#loading{position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;color:#d6e2f1;background:#111720;font-size:16px;padding:25px;z-index:2}#loading{background:#111720c9}#empty:not([hidden]),#loading:not([hidden]){display:flex}[hidden]{display:none!important}.image-footer{padding:9px 14px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend{display:flex;gap:13px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{display:inline-block;width:11px;height:11px;border:1px solid #748094}.panel-heading{padding:13px 15px;border-bottom:1px solid var(--border)}.panel-heading h3{font-size:16px;margin:0}.panel-heading p{font-size:12px;color:var(--muted);margin:3px 0 0}.point-card{padding:13px 15px;border-bottom:1px solid var(--border);border-left:4px solid transparent}.point-card:last-child{border-bottom:0}.point-card.active{background:#f5f8fc;border-left-color:#315c89}.point-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.point-name{display:inline-flex;align-items:center;gap:8px}.point-dot{width:13px;height:13px;border-radius:3px;border:1px solid #748094}.gt-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.gt-value small{font-size:12px;font-weight:400;color:var(--muted);margin-right:5px}.coords{font-size:12px;color:var(--muted);margin:3px 0 9px;font-variant-numeric:tabular-nums}.point-images{display:grid;grid-template-columns:1fr 1fr;gap:9px}.point-images figure{margin:0;min-width:0}.point-images img{display:block;width:100%;max-width:256px;aspect-ratio:1;object-fit:contain;background:#111;image-rendering:auto}.point-images figcaption{font-size:11px;color:var(--muted);margin-top:3px}.point-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.point-actions button{font-size:12px;padding:4px 9px}.point-actions a{font-size:12px}.point-count{font-size:11px;color:var(--muted)}.comparison{background:#fff;border:1px solid var(--border);border-radius:9px;margin-top:15px;padding:10px 14px}.comparison summary{cursor:pointer;font-size:14px}.comparison img{width:100%;height:auto;margin-top:10px}.dataset-links{font-size:12px;color:var(--muted);margin:15px 0 0;display:flex;gap:16px;flex-wrap:wrap}
@media(min-width:1500px){.workspace{grid-template-columns:minmax(0,1fr) 385px}.point-images img{max-height:154px;object-fit:contain;background:#111}}
@media(max-width:1050px){.workspace{grid-template-columns:minmax(0,1fr) 300px}.toolbar{gap:7px}.filters{gap:8px}#capture{min-width:230px}.viewport{height:650px}.point-card{padding:10px}.point-panel .gt-value{font-size:19px}}
@media(max-width:800px){header{padding:16px}main{padding:12px}.workspace{grid-template-columns:1fr}.point-panel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.panel-heading{grid-column:1/-1}.point-card{border-right:1px solid var(--border);border-bottom:0}.point-heading{display:block}.gt-value{font-size:20px}.point-images{grid-template-columns:1fr}.point-images figure:nth-child(2){display:none}.point-actions{display:block}.point-actions a{display:block;margin-top:7px}.viewport{height:min(73vw,670px);min-height:330px}.navigation{margin-left:0}.subject{align-items:start}.subject h2{font-size:18px}.back{display:none}}
@media(max-width:450px){#capture{min-width:0;width:100%}.capture-label{width:100%}.filters label{flex-wrap:wrap}.point-card{padding:8px}.coords{font-size:11px}.gt-value small{display:none}.point-images img{max-width:100%}.point-name{font-size:14px}.toolbar{font-size:12px}.image-footer{display:block}.legend{margin-top:5px}.subject{display:block}.subject .tag{margin:7px 5px 0 0}.point-count{display:none}}
.orientation-note{background:#fff4d9;border:1px solid #ebd39b;border-radius:7px;padding:9px 13px;margin:0 0 12px;color:#70531b;font-size:13px}
</style>
</head>
<body>
<header><div><h1>GT · P1 P2 P3 위치</h1><p>방향을 정렬한 전체 원본에서 세 측정 영역을 확인하세요.</p></div><a class="back" href="rotation_gallery.html">기존 회전 비교 갤러리</a></header>
<main>
<div class="filters">
<label>Case <select id="case" aria-label="Case 선택"><option value="all">전체 Case</option></select></label>
<label>데이터 <select id="split" aria-label="데이터 분할"><option value="all">전체</option><option value="train">Train</option><option value="val">Validation</option><option value="test">Test</option></select></label>
<label class="capture-label">촬영본 <select id="capture" aria-label="촬영본 선택"></select></label>
<div class="navigation"><button id="previous" aria-label="이전 촬영본">← 이전</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="다음 촬영본">다음 →</button></div>
</div>
<div class="subject"><div><h2 id="title"></h2><p id="metadata"></p></div><div><span class="tag" id="split-tag"></span><span class="tag" id="rotation-tag"></span></div></div>
<p class="orientation-note" id="orientation-note" hidden role="status"></p>
<div class="workspace">
<section class="image-pane" aria-label="원본에서 측정 위치 확인">
<div class="toolbar">
<button id="fit">전체 보기</button><button id="one-to-one" title="원본 1픽셀을 화면 1픽셀로">1:1</button><button id="zoom-out" aria-label="축소">−</button><span id="zoom">—</span><button id="zoom-in" aria-label="확대">＋</button>
<span class="separator"></span><label><input id="roi-toggle" type="checkbox" checked>ROI</label><label><input id="gt-toggle" type="checkbox">GT 겹치기</label><label class="opacity-control">투명도 <input id="opacity" type="range" min="5" max="90" value="45" aria-label="GT 마스크 불투명도"></label>
</div>
<div class="viewport" id="viewport" aria-label="마우스 휠로 확대·축소하고 드래그로 이동하는 전체 원본 사진">
<div class="scene" id="scene"><img id="raw" alt="방향을 정렬한 전체 원본"><img id="gt-layer" class="gt-layer" alt="Exposure 정답 영역" hidden><svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="P1 P2 P3 측정 위치"></svg></div>
<div id="loading" role="status">이미지를 불러오는 중입니다.</div><div id="empty" hidden role="status">조건에 맞는 촬영본이 없습니다.</div>
</div>
<div class="image-footer"><span>휠: 확대·축소 · 드래그: 이동 · 더블클릭: 전체 보기</span><div class="legend"><span><i class="swatch" style="background:var(--p1)"></i>P1 왼쪽</span><span><i class="swatch" style="background:var(--p2)"></i>P2 중앙</span><span><i class="swatch" style="background:var(--p3)"></i>P3 오른쪽</span><span><i class="swatch" style="background:#ff5c84"></i>Exposure GT</span></div></div>
</section>
<aside class="point-panel" id="point-panel"><div class="panel-heading"><h3>세 지점의 GT 함침율</h3><p>각 256 × 256 px · 흰색 마스크 = 미함침 영역</p></div><div id="points" style="display:contents"></div></aside>
</div>
<details class="comparison"><summary>회전 판단 근거 · 회전 전후 비교</summary><img id="rotation-comparison" alt="회전 전후와 방향 판단 근거 비교" loading="lazy"></details>
<div class="dataset-links"><a id="raw-link" target="_blank" rel="noopener">전체 원본 PNG</a><a id="mask-link" target="_blank" rel="noopener">전체 GT 마스크 PNG</a><a href="../point_measurements.csv">P1/P2/P3 측정값 CSV</a><a href="all_selected_upper.jpg">86장 상단 모아 보기</a></div>
</main>
<script id="viewer-data" type="application/json">__VIEWER_DATA__</script>
<script src="ui/viewer.js"></script>
</body>
</html>
